; =====================================================================
;  PlatformIO – CYD (ESP32-2432S028R) temperatur-gauge via MQTT
;  Hele TFT_eSPI-konfigurationen ligger som build_flags herunder,
;  så User_Setup.h i biblioteket skal IKKE røres.
; =====================================================================

[env:cyd]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; min_spiffs: to OTA app-partitioner à 1,9 MB (plads til TLS + OTA).
; default.csv's 1,3 MB er for lille når WiFiClientSecure linkes ind.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    knolleary/PubSubClient @ ^2.8
    jnthas/Improv WiFi Library @ ^0.0.4
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git   ; Unicode-fonte (ÆØÅ, °)

build_flags =
    ; --- fortæl TFT_eSPI at setup kommer herfra, ikke fra User_Setup.h ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1          ; CYD-varianten af ILI9341 (vigtig!)
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; --- display-pins (fast loddet på CYD) ---
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; --- fonte ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1               ; 7-segment-font til det store tal
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; --- SPI ---
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; --- farverækkefølge + inversion ---
    -D TFT_RGB_ORDER=TFT_BGR       ; denne CYD-variant bytter rød/blå om
    -D TFT_INVERSION_ON=1          ; dette panel (TPM408-2.8) viser farver inverteret

; --- Fejlfinding (fjern ; for at aktivere) ---
;   (er alle farver nu negativ/inverteret? skift TFT_INVERSION_ON ud med TFT_INVERSION_OFF)
;   (er rød/blå byttet om? fjern TFT_RGB_ORDER-linjen ovenfor)
;   (virker skærmen slet ikke: skift ILI9341_2_DRIVER ud med ILI9341_DRIVER)
