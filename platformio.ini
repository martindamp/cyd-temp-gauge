; =====================================================================
;  PlatformIO - CYD (ESP32-2432S028R) MQTT temperature gauge
;  All TFT_eSPI configuration is set as build_flags below, so the
;  library's User_Setup.h must NOT be touched.
; =====================================================================

[env:cyd]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; min_spiffs: two 1.9 MB OTA app partitions (room for TLS + OTA).
; default.csv's 1.3 MB is too small once WiFiClientSecure is linked in.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    knolleary/PubSubClient @ ^2.8
    jnthas/Improv WiFi Library @ ^0.0.4
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git   ; Unicode fonts (accents, degree sign)

build_flags =
    ; --- tell TFT_eSPI the setup comes from here, not from User_Setup.h ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1          ; the CYD variant of ILI9341 (important!)
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; --- display pins (hardwired on the CYD) ---
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; --- fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1               ; 7-segment font for the large value
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; --- SPI ---
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; --- colour order + inversion ---
    -D TFT_RGB_ORDER=TFT_BGR       ; this CYD variant swaps red/blue
    -D TFT_INVERSION_ON=1          ; this panel (TPM408-2.8) shows colours inverted

; --- Troubleshooting (remove ; to enable) ---
;   (all colours now negative/inverted? swap TFT_INVERSION_ON for TFT_INVERSION_OFF)
;   (red/blue swapped? remove the TFT_RGB_ORDER line above)
;   (screen stays completely black: swap ILI9341_2_DRIVER for ILI9341_DRIVER)
